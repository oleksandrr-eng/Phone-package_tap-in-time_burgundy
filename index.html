<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catch the Burgundy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one phone screen — target chip on top, phone carousel in the middle, round TAP button at the bottom; sheet slides up for the form */
:root{
  color-scheme: light;
  --bg:#f4f3f1;
  --ink:#111111;
  --ink-2:#77746f;
  --line:#e2dfda;
  --accent:#6b2733;          /* burgundy */
  --accent-soft:#f1e3e5;
  --on-accent:#ffffff;
  --page:var(--bg);          /* page background, may be a gradient */
  --card:#ffffff;            /* sheet, congratulations card, target chip */
  --field:#faf9f7;
  --btn:var(--ink);          /* round TAP button */
  --btn-ink:#ffffff;
  --glow:107,39,51;          /* rgb of the glow behind the phone */
  --scrim:rgba(17,17,17,.28);
  --f:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

/* ===== colour themes: set CONFIG.theme or add ?theme=noir to the link ===== */
:root[data-theme="noir"]{color-scheme:dark;--bg:#0b0b0d;--page:radial-gradient(120% 55% at 50% 0%,#2b1017 0%,#0b0b0d 62%);--ink:#f5f1ee;--ink-2:#9b948f;--line:#2b282b;
  --accent:#d0566c;--accent-soft:#2e151b;--card:#171619;--field:#201f23;--btn:#f5f1ee;--btn-ink:#0b0b0d;--glow:208,86,108;--scrim:rgba(0,0,0,.6)}
:root[data-theme="wine"]{color-scheme:dark;--bg:#3f111b;--page:linear-gradient(180deg,#5e1b28 0%,#2a0a11 100%);--ink:#fff3e3;--ink-2:#d6b2a3;--line:rgba(255,235,210,.16);
  --accent:#efc069;--accent-soft:rgba(239,192,105,.16);--on-accent:#2a0a11;--card:#34101a;--field:#45161f;--btn:linear-gradient(180deg,#f6d48a,#d29a3c);--btn-ink:#2a0a11;--glow:239,192,105;--scrim:rgba(20,3,7,.55)}
:root[data-theme="blush"]{--bg:#f8e6e9;--page:linear-gradient(180deg,#fdf1f3 0%,#f2d3d9 100%);--ink:#3b0f19;--ink-2:#9b6a73;--line:#ecc9d0;
  --accent:#8e2438;--accent-soft:#f8dde3;--card:#ffffff;--field:#fff6f7;--btn:#8e2438;--btn-ink:#ffffff;--glow:142,36,56;--scrim:rgba(59,15,25,.3)}
:root[data-theme="champagne"]{--bg:#f3eadb;--page:linear-gradient(180deg,#f8f2e7 0%,#e8d6b6 100%);--ink:#2b2017;--ink-2:#8c7761;--line:#e2d0b2;
  --accent:#6b2733;--accent-soft:#f1e1d8;--card:#fffaf2;--field:#fbf4e8;--btn:linear-gradient(180deg,#e6c47d,#b0823a);--btn-ink:#2b2017;--glow:176,130,58;--scrim:rgba(43,32,23,.3)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;position:fixed;inset:0;background:var(--page);background-color:var(--bg);color:var(--ink);font-family:var(--f);-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit}

.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:clamp(14px,3vh,28px) clamp(16px,3.4vh,32px)}

.top{width:100%;text-align:center}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:8px 0 0;font-size:clamp(24px,7vw,32px);font-weight:700;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.target{margin:14px auto 0;display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.target img{width:26px;height:32px;object-fit:contain}
.target span{font-size:13px;font-weight:600}
.target i{width:8px;height:8px;border-radius:50%;background:var(--accent)}

.reel{position:relative;flex:1;width:calc(100% + 2 * max(16px, env(safe-area-inset-left, 0px)));min-height:0;margin-top:clamp(8px,2vh,20px);overflow:hidden}
.reel img{position:absolute;left:50%;top:50%;height:min(54%,62vw,360px);width:auto;max-width:none;will-change:transform,opacity;pointer-events:none;
  filter:drop-shadow(0 18px 24px rgba(0,0,0,.14))}
.glow{--g:min(86vw,420px);position:absolute;left:50%;top:50%;width:var(--g);aspect-ratio:1;margin:calc(var(--g) / -2) 0 0 calc(var(--g) / -2);border-radius:50%;
  background:radial-gradient(circle, rgba(var(--glow),.3), rgba(var(--glow),0) 65%);opacity:0;pointer-events:none}
.mark{position:absolute;left:50%;bottom:4px;width:0;height:0;margin-left:-7px;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:9px solid var(--ink)}

.status{height:22px;margin-top:10px;font-size:14px;font-weight:600;color:var(--ink-2);text-align:center}
.status.win{color:var(--accent)}
.tap-btn{margin-top:clamp(10px,2.2vh,18px);width:clamp(96px,26vw,124px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;
  background:var(--btn);color:var(--btn-ink);font-size:20px;font-weight:700;letter-spacing:.12em;box-shadow:0 10px 24px rgba(0,0,0,.18), inset 0 0 0 6px rgba(255,255,255,.06)}
.tap-btn:active{transform:scale(.94)}
.tap-btn:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.tap-btn.claim{background:var(--accent);color:var(--on-accent);font-size:16px;letter-spacing:.06em}

/* bottom sheet */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:520px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;
  padding:10px max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-left, 0px));
  box-shadow:0 -10px 40px rgba(0,0,0,.12)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.01em;text-align:center}
.sheet .sub{margin:0 0 12px;font-size:13px;color:var(--ink-2);text-align:center}
.lead{display:flex;flex-direction:column;gap:10px}
.field{position:relative}
.field label{position:absolute;left:14px;top:8px;font-size:11px;font-weight:600;color:var(--ink-2);pointer-events:none}
.field input{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);font-family:var(--f);font-size:16px;font-weight:600;
  padding:24px 50px 9px 14px}
.field input:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.field input[aria-invalid="true"]{border-color:#c0392b}
.paste{position:absolute;right:7px;top:50%;transform:translateY(-50%);display:flex;border:0;border-radius:9px;background:var(--ink);color:var(--card);padding:8px;cursor:pointer}
.paste svg{width:16px;height:16px}
.paste:active{transform:translateY(-50%) scale(.92)}
.paste:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{min-height:16px;margin:0;font-size:12px;font-weight:600;color:#c0392b;text-align:center}
.ok{border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:700;padding:15px;cursor:pointer}
.ok:active{transform:scale(.98)}
.ok:disabled{opacity:.6}
.ok:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.done{text-align:center;padding-bottom:4px}
.done .check{width:52px;height:52px;margin:4px auto 10px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center}
.done .check svg{width:26px;height:26px}
.eta{font-size:30px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:6px}
.eta-label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.road{position:relative;height:112px;margin-top:8px;overflow:hidden;border-bottom:2px dashed var(--line)}
.scooter{position:absolute;left:50%;bottom:6px;width:108px;height:auto;margin-left:-54px;cursor:pointer;-webkit-user-drag:none}
.scooter:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:10px}
.puff{position:absolute;bottom:14px;width:12px;height:12px;border-radius:50%;background:var(--line);pointer-events:none}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:30;pointer-events:none}
.again{margin-top:8px;font-size:12px;color:var(--ink-2)}

/* congratulations card in the middle of the screen */
.winwrap{position:fixed;inset:0;z-index:22;display:grid;place-items:center;padding:20px;pointer-events:none}
.win-card{pointer-events:auto;width:min(340px,100%);background:var(--card);border-radius:28px;padding:22px 20px 20px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.28)}
.win-eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.win-card h2{margin:6px 0 0;font-size:clamp(28px,8.4vw,34px);font-weight:800;letter-spacing:-.02em;color:var(--accent)}
.win-photo{position:relative;height:min(34vh,250px);margin:8px 0 2px;overflow:visible}
.win-photo img{position:relative;display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 16px 20px rgba(0,0,0,.18))}
.win-glow{position:absolute;inset:6% 8%;border-radius:50%;background:radial-gradient(circle, rgba(var(--glow),.28), rgba(var(--glow),0) 68%)}
.win-name{font-size:15px;font-weight:700}
.win-sub{margin-top:2px;font-size:13px;color:var(--ink-2)}
.win-claim{width:100%;margin-top:16px;font-size:17px;letter-spacing:.1em;padding:17px}

/* tablet */
@media (min-width:700px){
  .app{max-width:780px;padding-block:clamp(24px,4vh,48px)}
  .eyebrow{font-size:14px}
  h1{font-size:46px;margin-top:10px}
  .target{margin-top:20px;padding:7px 18px 7px 7px;gap:12px}
  .target img{width:34px;height:42px}.target span{font-size:17px}.target i{width:10px;height:10px}
  .reel img{height:min(62%,500px)}
  .glow{--g:min(70vw,600px)}
  .status{font-size:18px;height:28px;margin-top:14px}
  .tap-btn{width:150px;font-size:24px}.tap-btn.claim{font-size:20px}
  .win-card{width:460px;padding:30px 30px 28px;border-radius:34px}
  .win-card h2{font-size:42px}
  .win-photo{height:min(40vh,380px)}
  .win-name{font-size:18px}.win-sub{font-size:15px}
  .win-claim{font-size:19px;padding:20px;border-radius:18px}
  .sheet{top:0;bottom:0;left:0;right:0;margin:auto;height:fit-content;width:480px;border-radius:30px;padding:26px 30px 30px}
  .grab{display:none}
  .sheet h2{font-size:26px;margin-bottom:6px}.sheet .sub{font-size:15px;margin-bottom:18px}
  .lead{gap:12px}.field input{font-size:18px;padding:27px 56px 11px 16px;border-radius:14px}.field label{font-size:12px;left:16px;top:9px}
  .ok{font-size:18px;padding:18px;border-radius:16px}
  .eta{font-size:38px}.road{height:130px}.scooter{width:132px;margin-left:-66px}
}

/* touch ring for screen recordings */
.tap{position:fixed;z-index:100;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;pointer-events:none;
  border:2.5px solid rgba(255,255,255,.95);box-shadow:0 0 0 1.5px rgba(0,0,0,.28), 0 0 12px rgba(0,0,0,.18)}
</style>
</head><body>
<div class="app">
  <header class="top">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <div class="target"><i></i><img id="targetImg" alt=""><span id="targetName"></span></div>
  </header>

  <div class="reel" id="reel">
    <div class="glow" id="glow"></div>
    <div class="mark"></div>
  </div>

  <div class="status" id="status"></div>
  <button class="tap-btn" id="tapBtn">TAP</button>
</div>

<canvas id="confetti"></canvas>
<div class="winwrap" id="win" hidden role="dialog" aria-labelledby="winTitle">
  <div class="win-card" id="winCard">
    <div class="win-eyebrow">Black Friday</div>
    <h2 id="winTitle">Congratulations!</h2>
    <div class="win-photo"><div class="win-glow"></div><img id="winImg" alt=""></div>
    <div class="win-name" id="winName"></div>
    <div class="win-sub">is yours — claim it now</div>
    <button class="ok win-claim" id="winClaim" type="button">CLAIM</button>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" hidden aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <div id="formView">
    <h2 id="sheetTitle">Where should we deliver it?</h2>
    <p class="sub" id="sheetSub"></p>
    <form class="lead" id="leadForm" novalidate>
      <div class="field"><label for="fName">Name</label><input id="fName" autocomplete="name"><button class="paste" type="button" data-for="fName" data-key="name" aria-label="Paste name"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V2.5h6V4"/></svg></button></div>
      <div class="field"><label for="fPhone">Phone</label><input id="fPhone" type="tel" inputmode="tel" autocomplete="tel"><button class="paste" type="button" data-for="fPhone" data-key="phone" aria-label="Paste phone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V2.5h6V4"/></svg></button></div>
      <div class="field"><label for="fAddr">Address</label><input id="fAddr" autocomplete="street-address"><button class="paste" type="button" data-for="fAddr" data-key="address" aria-label="Paste address"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V2.5h6V4"/></svg></button></div>
      <p class="err" id="err" role="alert"></p>
      <button class="ok" id="okBtn" type="button">Confirm</button>
    </form>
  </div>
  <div class="done" id="doneView" hidden>
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2 id="doneTitle"></h2>
    <div class="eta" id="eta">03:00:00</div>
    <div class="eta-label">Estimated delivery</div>

/* the carousel loop: one target among other colours and models */
const LOOP = ["iphone_18_pro_max__burgundy","iphone_17_pro_max__cosmic_orange","iphone_17_air__sky_blue","iphone_18_pro__glacier_blue",
  "iphone_17__lavender","iphone_16_pro__desert_titanium","iphone_17e__soft_pink","iphone_air_2__light_peach",
  "iphone_16__ultramarine","iphone_18_pro_max__silver","iphone_17__sage","iphone_16_pro_max__black_titanium"];
const N = LOOP.length, TARGET = Math.max(0, LOOP.indexOf(CONFIG.target));

$("eyebrow").textContent = CONFIG.eyebrow;
$("title").innerHTML = CONFIG.title;
$("targetImg").src = PHOTOS[CONFIG.target + "_s"];
$("targetName").textContent = CONFIG.targetName;
$("status").textContent = "Tap when it's in the middle";

const reel = $("reel");
/* the reel is an endless line of numbered slots k; a small pool of <img> is reused for the 7 slots around the centre,
   so a phone is never drawn twice at once (the winning phone is placed at slot `to`, the target is removed from other new slots) */
const POOL = 7;
const imgs = Array.from({length: POOL}, () => { const im = new Image(); im.alt = ""; reel.appendChild(im); return im; });
const mod = (a, n) => ((a % n) + n) % n;
let force = null;          // {to, tapK} while a guaranteed win is being set up
function phoneAt(k){
  const base = LOOP[mod(k, N)];
  if(!force) return base;
  if(k === force.to) return CONFIG.target;
  if(base === CONFIG.target && k > force.tapK) return LOOP[mod(k + 6, N)];    // a stand-in, so the target never shows up next to the winner
  return base;
}
const slotImg = k => imgs[mod(k, POOL)];

/* state */
let landTo = 0, offset = 0, mode = "spin", last = performance.now(), stopAnim = null, lastTick = 0;

function draw(){
  const W = reel.clientWidth, ih = imgs[0].offsetHeight || 300, S = Math.min(W * .52, Math.max(240, ih * .68)), c = Math.round(offset);
  for(let k = c - 3; k <= c + 3; k++){
    const im = slotImg(k), d = k - offset, a = Math.abs(d);
    const key = phoneAt(k);
    if(im.dataset.p !== key){ im.dataset.p = key; im.src = PHOTOS[key + "_l"]; }
    if(a > 2.6){ im.style.opacity = 0; continue; }
    const sc = Math.max(.4, 1 - a * .36);
    let op = Math.max(0, 1 - a * .42);
    if(force && key === CONFIG.target && k !== force.to) op *= Math.max(0, 1 - (performance.now() - force.t0) / 300);   // an old target that has just passed fades out, so it never doubles the winner
    im.style.transform = `translate(-50%,-50%) translateX(${d * S}px) scale(${sc})`;
    im.style.opacity = op;
    im.style.zIndex = 10 - Math.round(a * 3);
  }
}
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if(mode === "spin") offset += CONFIG.speed * dt;
  else if(mode === "stopping" && stopAnim){
    const k = Math.min(1, (now - stopAnim.t0) / stopAnim.dur), e = 1 - Math.pow(1 - k, 3);
    offset = stopAnim.from + (stopAnim.to - stopAnim.from) * e;
    if(k >= 1){ mode = "stopped"; landed(); }
  }
  const idx = Math.floor(offset + .5);
  if(idx !== lastTick){ lastTick = idx; if(mode !== "stopped") tick(); }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener("resize", draw);

/* sound */
let actx;
function beep(freq=1300, len=.025, vol=.035, type="sine"){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+len);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+len+.01); }catch(e){}
}
const tick = () => { if(actx) beep(); };

/* TAP */
$("tapBtn").addEventListener("click", () => {
  if(mode === "spin"){
    beep(900,.05,.05,"triangle");
    // stop ~3 phones ahead: that phone is still off-screen at the moment of the tap
    let to = Math.ceil(offset + 2.7);
    if(CONFIG.alwaysWin){
      const tapK = Math.floor(offset + 2.6);                       // last slot that is already on screen
      for(let k = Math.ceil(offset + .3); k <= tapK; k++) if(mod(k, N) === TARGET){ to = k; break; }   // the target is already coming: just stop on it
      force = {to, tapK, t0: performance.now()};
    }
    landTo = to;
    const dist = to - offset, dur = 3 * dist / CONFIG.speed * 1000;      // starts at full speed, eases to a stop
    stopAnim = {from: offset, to, t0: performance.now(), dur};
    mode = "stopping";
    $("tapBtn").disabled = true;
    $("status").textContent = "";
  } else if(mode === "stopped" && $("tapBtn").classList.contains("claim")){
    openSheet();
  } else if(mode === "stopped"){
    // missed (only when alwaysWin is false): spin again
    mode = "spin"; $("status").textContent = "Tap when it's in the middle"; $("status").classList.remove("win");
  }
});

function landed(){
  $("tapBtn").disabled = false;
  if(phoneAt(landTo) === CONFIG.target){
    $("status").textContent = "Perfect timing!"; $("status").classList.add("win");
    $("tapBtn").style.visibility = "hidden";                     // the CLAIM button lives on the Congratulations card
    beep(880,.22,.06,"triangle"); setTimeout(()=>beep(1320,.3,.05,"triangle"),120);
    try{ navigator.vibrate && navigator.vibrate([50,40,90]); }catch(e){}
    const im = slotImg(landTo);
    $("glow").animate([{opacity:0,transform:"scale(.6)"},{opacity:1,transform:"scale(1.05)"},{opacity:.85,transform:"scale(1)"}],{duration:700,easing:"ease-out",fill:"forwards"});
    im.animate([{scale:"1"},{scale:"1.08"},{scale:"1.04"}],{duration:600,easing:"cubic-bezier(.3,1.4,.5,1)",fill:"forwards"});
    partyPoppers();
    clearTimeout(winTimer); winTimer = setTimeout(showWin, 650);
  } else {
    $("status").textContent = "So close — tap to try again";
    $("tapBtn").textContent = "TAP";
  }
}

/* congratulations card → CLAIM → form */
let winTimer;
function showWin(){
  $("winImg").src = PHOTOS[CONFIG.target + "_l"]; $("winName").textContent = CONFIG.targetName;
  show($("win"), true); $("scrim").classList.add("on");
  $("winCard").animate([{transform:"scale(.7) translateY(30px)",opacity:0},{transform:"scale(1.04)",opacity:1,offset:.7},{transform:"none",opacity:1}],{duration:520,easing:"cubic-bezier(.2,.8,.3,1)"});
  $("winImg").animate([{transform:"translateY(0)"},{transform:"translateY(-6px)"}],{duration:1500,delay:520,iterations:Infinity,direction:"alternate",easing:"ease-in-out"});
  $("winClaim").animate([{boxShadow:`0 0 0 0 rgba(${GLOW},.5)`},{boxShadow:`0 0 0 12px rgba(${GLOW},0)`}],{duration:1400,delay:700,iterations:Infinity,easing:"ease-out"});
  beep(1040,.12,.05,"triangle");
}
$("winClaim").addEventListener("click", () => {
  const a = $("winCard").animate([{opacity:1,transform:"none"},{opacity:0,transform:"scale(.94)"}],{duration:160,easing:"ease-in",fill:"forwards"});
  a.onfinish = () => { show($("win"), false); a.cancel(); openSheet(); };
});

/* sheet: form → done */
function openSheet(){
  pickPerson();
  show($("formView"), true); show($("doneView"), false);
  show($("sheet"), true); $("scrim").classList.add("on");
  const tablet = matchMedia("(min-width:700px)").matches;
  $("sheet").animate(tablet ? [{opacity:0,transform:"translateY(28px) scale(.97)"},{opacity:1,transform:"none"}] : [{transform:"translateY(100%)"},{transform:"none"}],{duration:380,easing:"cubic-bezier(.2,.8,.2,1)"});
  $("sheetSub").textContent = CONFIG.targetName;
}
$("leadForm").addEventListener("submit", e => { e.preventDefault(); submitLead(); });
$("okBtn").addEventListener("click", submitLead);
$("leadForm").addEventListener("keydown", e => { if(e.key==="Enter" && e.target.tagName==="INPUT"){ e.preventDefault(); submitLead(); } });
async function submitLead(){
  if($("okBtn").disabled) return;
  const f = ["fName","fPhone","fAddr"].map($);
  let bad = null;
  f.forEach(x => { const ok = x.id==="fPhone" ? x.value.replace(/\D/g,"").length>=7 : x.value.trim().length>=2;
    x.setAttribute("aria-invalid", ok ? "false" : "true"); if(!ok && !bad) bad = x; });
  if(bad){ $("err").textContent = bad.id==="fPhone" ? "Enter a phone number with at least 7 digits." : "Fill in your " + (bad.id==="fName" ? "name." : "delivery address."); bad.focus(); return; }
  $("err").textContent = ""; $("okBtn").disabled = true;
  if(CONFIG.submitUrl){
    const data = {name:f[0].value.trim(), phone:f[1].value.trim(), address:f[2].value.trim(), prize:CONFIG.targetName, source:location.href, ts:new Date().toISOString()};
    try{ await fetch(CONFIG.submitUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)}); }catch(e){}
  }
  show($("formView"), false); show($("doneView"), true);
  $("doneTitle").textContent = CONFIG.doneTitle;
  startEta(); rideIn();
}
let etaTimer, rideAnims = [];
const p2 = n => String(n).padStart(2,"0");
function startEta(){
  const end = Date.now() + CONFIG.deliveryHours*3600*1000;
  const t = () => { let d = Math.max(0,end-Date.now())/1000|0; $("eta").textContent = `${p2(d/3600|0)}:${p2((d%3600)/60|0)}:${p2(d%60)}`; };
  t(); clearInterval(etaTimer); etaTimer = setInterval(t,1000);
}
function rideIn(){
  rideAnims.forEach(a=>a.cancel()); rideAnims = [];
  const sc = $("scooter"), road = $("road"), W = road.clientWidth;
  const from = W / 2 + 90;                                    // the courier faces left: it drives in from the right
  rideAnims.push(sc.animate([{transform:`translateX(${from}px) rotate(-2deg)`},{transform:"translateX(-10px) rotate(1deg)",offset:.86},{transform:"none"}],{duration:1300,easing:"cubic-bezier(.2,.7,.3,1)"}));
  rideAnims.push(sc.animate([{translate:"0 0"},{translate:"0 -2px"}],{duration:420,delay:1300,iterations:Infinity,direction:"alternate",easing:"ease-in-out"}));
  // exhaust puffs while it arrives
  for(let i = 0; i < 7; i++){
    const p = document.createElement("span"); p.className = "puff"; p.style.left = `calc(50% + ${50 + i*4}px)`; road.appendChild(p);
    const a = p.animate([{transform:"scale(.5)",opacity:.8},{transform:"translate(26px,-14px) scale(1.6)",opacity:0}],{duration:700,delay:i*110,easing:"ease-out",fill:"backwards"});
    a.onfinish = () => p.remove(); rideAnims.push(a);
  }
}

/* tap the courier: start over */
function restart(){
  clearInterval(etaTimer); rideAnims.forEach(a=>a.cancel()); rideAnims = []; document.querySelectorAll(".puff").forEach(p=>p.remove());
  clearTimeout(winTimer); show($("win"), false); $("winImg").getAnimations().forEach(a=>a.cancel());
  $("scrim").classList.remove("on"); show($("sheet"), false);
  $("leadForm").reset(); $("okBtn").disabled = false; $("err").textContent = "";
  ["fName","fPhone","fAddr"].forEach(id => { $(id).setAttribute("aria-invalid","false"); $(id).style.fontSize=""; });
  $("glow").getAnimations().forEach(a=>a.cancel()); imgs.forEach(im => im.getAnimations().forEach(a=>a.cancel())); force = null; confettiClear();
  $("tapBtn").textContent = "TAP"; $("tapBtn").classList.remove("claim"); $("tapBtn").disabled = false; $("tapBtn").style.visibility = "";
  $("status").textContent = "Tap when it's in the middle"; $("status").classList.remove("win");
  mode = "spin";
}
$("scooter").addEventListener("click", restart);
$("scooter").addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); restart(); } });

/* paste: random fictional people (555-01xx numbers are reserved fictional) */
const FIRST = ["Lucy","Mason","Ava","Noah","Emma","Liam","Mia","Ethan","Chloe","Jack","Olivia","Lucas","Grace","Owen","Ella","Leo","Zoe","Ryan","Lily","Dylan"];
const LAST  = ["Harper","Reed","Whitfield","Carter","Brooks","Foster","Dalton","Cole","Bennett","Morrison","Hayes","Porter","Sullivan","Griffin","Wells","Parker","Bishop","Lane","Monroe","Shaw"];
const CITY  = [["LA","213"],["Chicago","312"],["Miami","305"],["Austin","512"],["Seattle","206"],["Vegas","702"],["SF","415"],["NYC","646"],["Atlanta","404"],["Phoenix","602"],["Denver","303"],["Boston","617"]];
const STREET= ["Fairy Ln","Maple St","Palm Ave","Oak Rd","Hill Dr","Star Blvd","Bay Ct","Lantern St","Peach Way","Cactus Pl","Cedar St","Willow Ave","Sunset Blvd","Pine Rd"];
const pick = a => a[Math.floor(Math.random()*a.length)];
let person;
function pickPerson(){
  const [city, area] = pick(CITY);
  person = {name: pick(FIRST)+" "+pick(LAST), phone:`+1 (${area}) 555-01${String(Math.floor(Math.random()*100)).padStart(2,"0")}`,
            address:`${city}, ${1+Math.floor(Math.random()*240)} ${pick(STREET)}`};
}
pickPerson();
document.querySelectorAll(".paste").forEach(btn => btn.addEventListener("click", () => {
  const el = $(btn.dataset.for); el.value = person[btn.dataset.key]; el.setAttribute("aria-invalid","false"); $("err").textContent = ""; fitText(el);
}));
function fitText(el){ el.style.fontSize=""; let s=parseFloat(getComputedStyle(el).fontSize); while(el.scrollWidth>el.clientWidth && s>11){ s-=1; el.style.fontSize=s+"px"; } }
["fName","fPhone","fAddr"].forEach(id => $(id).addEventListener("input", e => fitText(e.target)));

/* party poppers: paper confetti shot from both bottom corners, plus streamers */
const cv = $("confetti"), cx = cv.getContext("2d");
let parts = [], confRaf = 0, confLast = 0;
const CONF_COLORS = {
  classic:   ["#6b2733","#a23b4c","#e8b4ba","#f2c75c","#111111","#ffffff","#d9d4cc"],
  noir:      ["#d0566c","#7a2a38","#e8b4ba","#f2c75c","#ffffff","#c9a46a","#3a3a40"],
  wine:      ["#efc069","#f6d48a","#fff3e3","#d0566c","#b8862f","#ffffff","#8e2438"],
  blush:     ["#8e2438","#d65a72","#f4a6b5","#ffffff","#f2c75c","#3b0f19","#fbd3db"],
  champagne: ["#c99a48","#e6c47d","#6b2733","#ffffff","#2b2017","#f1e1c4","#a23b4c"]
}[THEME] || ["#6b2733","#a23b4c","#e8b4ba","#f2c75c","#111111","#ffffff","#d9d4cc"];
function sizeCanvas(){ const r = devicePixelRatio || 1; cv.width = innerWidth * r; cv.height = innerHeight * r; cx.setTransform(r,0,0,r,0,0); }
sizeCanvas(); addEventListener("resize", sizeCanvas);
function shoot(x, y, ang, n, power){
  for(let i = 0; i < n; i++){
    const a = ang + (Math.random() - .5) * .75, v = power * (.45 + Math.random() * .65);
    const streamer = Math.random() < .14;
    parts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: streamer ? 4 : 6 + Math.random() * 6, h: streamer ? 18 + Math.random() * 14 : 4 + Math.random() * 5,
      rot: Math.random() * 6.28, vr: (Math.random() - .5) * 14, tilt: Math.random() * 6.28, vt: 4 + Math.random() * 8,
      c: CONF_COLORS[(Math.random() * CONF_COLORS.length) | 0], life: 0, max: 2.6 + Math.random() * 1.2});
  }
}
function confStep(now){
  const dt = Math.min(.04, (now - confLast) / 1000 || .016); confLast = now;
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life < p.max && p.y < innerHeight + 40);
  for(const p of parts){
    p.life += dt; p.vy += 900 * dt; const drag = Math.pow(.12, dt); p.vx *= drag; p.vy = p.vy * Math.pow(.35, dt);    // gravity + air drag
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.tilt += p.vt * dt;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.scale(1, Math.cos(p.tilt));
    cx.globalAlpha = Math.min(1, (p.max - p.life) * 2.5); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
  }
  confRaf = parts.length ? requestAnimationFrame(confStep) : 0;
  if(!parts.length) cx.clearRect(0, 0, innerWidth, innerHeight);
}
function pop(){ beep(180,.09,.09,"square"); beep(2400,.04,.05,"square"); }
function partyPoppers(){
  const W = innerWidth, H = innerHeight, pw = Math.min(980, H * 1.25);
  const volley = () => { shoot(-6, H - 10, -1.05, 70, pw); shoot(W + 6, H - 10, -Math.PI + 1.05, 70, pw); pop();
    try{ navigator.vibrate && navigator.vibrate(30); }catch(e){} };
  volley(); setTimeout(volley, 260);
  setTimeout(() => shoot(W / 2, H * .38, -Math.PI / 2, 40, pw * .55), 520);
  if(!confRaf){ confLast = performance.now(); confRaf = requestAnimationFrame(confStep); }
}
function confettiClear(){ parts = []; cx.clearRect(0, 0, innerWidth, innerHeight); }

/* no scrolling or pull-to-refresh */
document.addEventListener("touchmove", e => { if(!e.target.closest("input")) e.preventDefault(); }, {passive:false});

/* touch ring on every tap */
document.addEventListener("pointerdown", e => {
  const r = document.createElement("span"); r.className = "tap"; r.style.left = e.clientX+"px"; r.style.top = e.clientY+"px";
  document.body.appendChild(r);
  r.animate([{transform:"scale(.35)",opacity:1},{opacity:.9,offset:.6},{transform:"scale(1.1)",opacity:0}],{duration:600,easing:"ease-out"}).onfinish = () => r.remove();
}, {passive:true});
</script>
